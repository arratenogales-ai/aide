<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test form</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; }
    label { display: block; margin-top: 12px; }
    input, textarea { width: 100%; padding: 6px; }
    button { margin-top: 16px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Request information</h1>
  <form id="formulario">
    <label for="name">Name</label>
    <input id="name" name="name" required>
    <label for="email">Email</label>
    <input id="correo" name="email" type="email" required>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="3"></textarea>
    <button id="enviar" type="submit">Send request</button>
  </form>
  <p id="resultado"></p>
  <script>
    document.getElementById("formulario").addEventListener("submit", function (e) {
      e.preventDefault();
      const nombre = document.getElementById("name").value;
      document.getElementById("resultado").textContent = "Thanks, " + nombre + ". Request sent.";
      document.title = "Form sent";
    });
  </script>
</body>
</html>
